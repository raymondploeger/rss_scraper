<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Monitoring Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="brand-kicker">Monitoring</p>
          <h1>RSS Dashboard</h1>
          <p class="brand-copy">Google Alerts feed aggregation with live updates.</p>
        </div>

        <section class="panel">
          <div class="panel-heading">
            <h2>Add Feed</h2>
            <p>Up to 50 RSS feeds</p>
          </div>
          <form id="feed-form" class="feed-form">
            <label>
              <span>Feed Name</span>
              <input id="feed-name" name="name" type="text" placeholder="Brand Mentions" required />
            </label>
            <label>
              <span>Topic</span>
              <input id="feed-topic" name="topic" type="text" placeholder="Marketing" required />
            </label>
            <label>
              <span>RSS URL</span>
              <input
                id="feed-url"
                name="rssUrl"
                type="url"
                placeholder="https://www.google.com/alerts/feeds/..."
                required
              />
            </label>
            <button type="submit">Add Feed</button>
          </form>
          <p id="feed-form-message" class="muted-message"></p>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Feed Health</h2>
            <button id="refresh-all-button" class="ghost-button" type="button">Refresh All</button>
          </div>
          <div id="feed-list" class="feed-list"></div>
        </section>
      </aside>

      <main class="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live Monitoring</p>
            <h2>Latest Articles</h2>
          </div>
          <div class="topbar-status">
            <span id="connection-badge" class="status-badge offline">Offline</span>
            <span id="last-poll-label" class="topbar-meta">Last poll: --</span>
          </div>
        </header>

        <section class="summary-grid" id="summary-grid">
          <article class="summary-card">
            <span>Active Feeds</span>
            <strong id="metric-active-feeds">0</strong>
          </article>
          <article class="summary-card">
            <span>Topics</span>
            <strong id="metric-topics">0</strong>
          </article>
          <article class="summary-card">
            <span>Articles Today</span>
            <strong id="metric-articles-today">0</strong>
          </article>
          <article class="summary-card">
            <span>Failed Feeds</span>
            <strong id="metric-failed-feeds">0</strong>
          </article>
        </section>

        <section class="filters-bar">
          <label>
            <span>Topic</span>
            <select id="topic-filter">
              <option value="">All topics</option>
            </select>
          </label>
          <label>
            <span>Feed</span>
            <select id="feed-filter">
              <option value="">All feeds</option>
            </select>
          </label>
          <label>
            <span>Start Date</span>
            <input id="start-date-filter" type="date" />
          </label>
          <label>
            <span>End Date</span>
            <input id="end-date-filter" type="date" />
          </label>
          <button id="apply-filters-button" type="button">Apply Filters</button>
          <button id="clear-filters-button" class="ghost-button" type="button">Clear</button>
        </section>

        <section class="content-head">
          <div>
            <p class="content-title">Article Stream</p>
            <p id="results-count" class="muted-message">0 results</p>
          </div>
        </section>

        <section id="articles-grid" class="articles-grid"></section>
      </main>
    </div>

    <template id="article-card-template">
      <article class="article-card">
        <a class="article-link" target="_blank" rel="noopener noreferrer">
          <div class="card-media">
            <img class="card-image" alt="" />
            <div class="card-topic"></div>
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-source"></span>
              <span class="card-date"></span>
            </div>
            <h3 class="card-title"></h3>
            <p class="card-feed"></p>
          </div>
        </a>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
