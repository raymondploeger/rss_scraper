<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoring Dashboard</title>
    <link rel="stylesheet" href="/styles.css?v=20260323b" />
    <script>
      (function () {
        const storageKey = "rss-monitor-theme";
        const savedTheme = window.localStorage.getItem(storageKey);
        const isDark = savedTheme === "dark";
        const value = isDark ? "dark" : "";
        document.documentElement.dataset.theme = value;
        document.documentElement.classList.toggle("dark-theme", isDark);
        document.addEventListener("DOMContentLoaded", function () {
          document.body.dataset.theme = value;
          document.body.classList.toggle("dark-theme", isDark);
          const button = document.getElementById("theme-toggle");
          if (!button) {
            return;
          }

          button.textContent = isDark ? "Light mode" : "Dark mode";
        });
      })();
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Public Intelligence</p>
          <h1>Monitoring Dashboard</h1>
          <p class="header-copy">Company and topic monitoring</p>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="ghost-button" type="button">Dark mode</button>
          <button id="refresh-now" class="primary-button" type="button">Refresh feeds</button>
        </div>
      </header>

      <section class="toolbar">
        <div class="toolbar-grid">
          <label class="field field-search">
            <span>Search</span>
            <input id="search-filter" type="search" placeholder="Search title, keyword, source" />
          </label>
          <label class="field">
            <span>Topic</span>
            <select id="topic-filter">
              <option value="">All topics</option>
            </select>
          </label>
          <label class="field">
            <span>Feed</span>
            <select id="feed-filter">
              <option value="">All feeds</option>
            </select>
          </label>
          <label class="field">
            <span>From</span>
            <input id="from-filter" type="date" />
          </label>
          <label class="field">
            <span>To</span>
            <input id="to-filter" type="date" />
          </label>
          <label class="toggle-field">
            <input id="duplicates-toggle" type="checkbox" />
            <span>Show duplicates</span>
          </label>
          <label class="toggle-field">
            <input id="grouped-toggle" type="checkbox" checked />
            <span>Grouped view</span>
          </label>
          <div class="toolbar-actions">
            <button id="clear-filters" class="ghost-button" type="button">Reset</button>
          </div>
        </div>
      </section>

      <section class="summary-grid" id="summary" aria-live="polite"></section>

      <section class="dashboard-layout">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Trending</p>
                <h2>Topic Signals</h2>
              </div>
              <select id="trend-timeframe" class="compact-select">
                <option value="24h">24 hours</option>
                <option value="7d">7 days</option>
                <option value="30d">30 days</option>
              </select>
            </div>
            <div id="trends" class="trend-list"></div>
          </section>

          <section class="panel admin-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Feeds</p>
                <h2>Manage Feeds</h2>
              </div>
              <button id="toggle-feed-manager" class="ghost-button" type="button">Hide</button>
            </div>
            <form id="feed-form" class="feed-form">
              <label class="field">
                <span>Feed name</span>
                <input id="feed-name" type="text" placeholder="Google Alerts" />
              </label>
              <label class="field">
                <span>Topic</span>
                <input id="feed-topic" type="text" placeholder="Company news" />
              </label>
              <label class="field field-full">
                <span>RSS URL</span>
                <input id="feed-url" type="url" placeholder="https://www.google.com/alerts/feeds/..." required />
              </label>
              <label class="field">
                <span>Source type</span>
                <select id="feed-source-type">
                  <option value="google-alert">Google Alert</option>
                  <option value="news-site">News site</option>
                  <option value="blog">Blog</option>
                  <option value="rss">Generic RSS</option>
                </select>
              </label>
              <label class="toggle-field">
                <input id="feed-active" type="checkbox" checked />
                <span>Active feed</span>
              </label>
              <div class="form-actions">
                <button id="submit-feed" class="primary-button" type="submit">Add feed</button>
              </div>
            </form>
            <p id="admin-status" class="status-line admin-status" role="status">Add, edit, or refresh feeds from this panel.</p>
            <div id="feed-manager-section">
              <div id="feed-manager" class="feed-manager"></div>
            </div>
          </section>
        </aside>

        <main class="main-content">
          <section class="content-header">
            <div>
              <p class="eyebrow">Live Stream</p>
              <h2 id="content-title">Latest coverage</h2>
              <p id="status-line" class="status-line">Connecting to live updates...</p>
            </div>
            <span id="results-count" class="results-pill">0 results</span>
          </section>

          <section id="articles" class="card-grid" aria-live="polite"></section>
        </main>
      </section>
    </div>

    <template id="summary-card-template">
      <article class="summary-card">
        <span class="summary-label"></span>
        <strong class="summary-value"></strong>
      </article>
    </template>

    <template id="article-card-template">
      <article class="article-card">
        <a class="article-link" target="_blank" rel="noopener noreferrer">
          <div class="article-image-wrap">
            <img class="article-image" alt="" loading="lazy" />
            <span class="article-topic"></span>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <span class="article-source"></span>
              <span class="article-date"></span>
            </div>
            <h3 class="article-title"></h3>
            <p class="article-summary"></p>
            <div class="article-footer">
              <span class="article-feed"></span>
              <span class="article-badge"></span>
            </div>
          </div>
        </a>
        <div class="related-panel" hidden>
          <h4>Related articles</h4>
          <div class="related-list"></div>
        </div>
      </article>
    </template>

    <template id="feed-manager-template">
      <article class="feed-card">
        <div class="feed-card-grid">
          <label class="field">
            <span>Name</span>
            <input class="manage-name" type="text" />
          </label>
          <label class="field">
            <span>Topic</span>
            <input class="manage-topic" type="text" />
          </label>
          <label class="field field-full">
            <span>RSS URL</span>
            <input class="manage-url" type="url" />
          </label>
          <label class="field">
            <span>Source type</span>
            <select class="manage-source-type">
              <option value="google-alert">Google Alert</option>
              <option value="news-site">News site</option>
              <option value="blog">Blog</option>
              <option value="rss">Generic RSS</option>
            </select>
          </label>
          <label class="toggle-field">
            <input class="manage-active" type="checkbox" />
            <span>Active</span>
          </label>
          <div class="feed-actions">
            <button class="save-feed primary-button" type="button">Save</button>
            <button class="delete-feed ghost-button" type="button">Delete</button>
          </div>
        </div>
        <p class="feed-meta"></p>
      </article>
    </template>

    <script defer src="/app.js?v=20260323b"></script>
  </body>
</html>
